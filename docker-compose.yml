services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://agrihub:agrihub@db:5432/agrihub
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run db:migrate && npm start"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agrihub
      POSTGRES_PASSWORD: agrihub
      POSTGRES_DB: agrihub
    ports:
      - "5433:5432"
    volumes:
      - agrihub-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrihub"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  agrihub-pg-data:
